name: Dev release

on:
  push:
    branches:
      - glass-dev
    paths:
      - '.github/workflows/dev_release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dev-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "No APK found"; exit 1; fi
          TAG="dev-${GITHUB_RUN_NUMBER}"
          cp "$APK" "Lawnchair-glass-drawer-${TAG}.apk"
          gh release create "$TAG" "Lawnchair-glass-drawer-${TAG}.apk" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Glass drawer dev build #${GITHUB_RUN_NUMBER}" \
            --notes "Debug build of branch glass-dev at ${GITHUB_SHA}."
